name: Deploy CTA Strategy Lab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Unit tests
        run: node --test tests/*.test.js
      - name: Check data input
        run: |
          if [ ! -f data/catalog.js ] && [ ! -f cta-public-ohlc-export.zip ]; then
            echo '::error::Upload cta-public-ohlc-export.zip to the repository root. Source code is present, but market data has not been imported.'
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare approved market packs
        run: |
          python -m pip install -r requirements-export.txt
          python scripts/prepare_data.py
      - name: Audit and reproduce examples
        run: |
          node scripts/audit_data.js
          node scripts/build_cases.js
          node scripts/build_exit_cases.js
          mkdir -p _site
          cp index.html README.md LICENSE _site/
          cp -r assets data docs _site/
          touch _site/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: built-site-and-validation
          path: _site
          retention-days: 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
