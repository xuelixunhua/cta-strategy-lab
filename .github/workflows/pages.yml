name: Deploy CTA Strategy Lab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Check complete site
        run: |
          test -f index.html
          test -f assets/engine.js
          test -f data/catalog.js
          node --test tests/*.test.js
          node scripts/audit_data.js
          mkdir -p _site
          cp index.html _site/
          cp -r assets data docs _site/
          cp README.md LICENSE _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
