name: Verify CTA Strategy Lab
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Unit tests
        run: node --test tests/*.test.js
      - name: Dataset and accounting audit
        run: node scripts/audit_data.js
      - name: Reproduce worked examples
        run: |
          node scripts/build_cases.js
          node scripts/build_exit_cases.js
      - uses: actions/upload-artifact@v4
        with:
          name: verified-research-results
          path: |
            docs/data-audit-results.json
            docs/CASE_STUDIES.md
            docs/example-results.json
            docs/EXIT_CASES.md
            docs/exit-example-results.json
          retention-days: 7
